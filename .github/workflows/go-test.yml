name: Go tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test tests/appearance.test.js
      - name: Build Docker image
        run: docker build -t tenderduty:ci .
      - name: Check Docker entrypoint
        run: docker run --rm tenderduty:ci -example-config > /dev/null
