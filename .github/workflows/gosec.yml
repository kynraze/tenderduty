---
name: Gosec
on:
  push:
    branches:
      - main
      - release/*
      - develop
  pull_request:
    branches:
      - main
      - release/v2
      - develop
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # run with our own Go toolchain, the gosec action image may not have the version go.mod needs
      - name: Run Gosec Security Scanner
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
