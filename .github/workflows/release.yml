name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/dist/tenderduty-linux-$arch" .
          done
          cd "$RUNNER_TEMP/dist"
          sha256sum tenderduty-* > sha256sums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --generate-notes
