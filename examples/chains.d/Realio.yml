---
# Realio multistaking: several validators on one chain, each with its own node.
# They show up as "Realio / RIO" and "Realio / dstrx".

# Checked against the RPC node when connecting.
chain_id: realionetwork_3301-1
# Fall back to a public RPC node if a validator's nodes fail?
public_fallback: yes

# Only settings that differ from alert_defaults.
# alerts:
#   consecutive_missed: 3

# Shared nodes: every validator falls back to them when its own fail. alert_if_down is ignored here.
# nodes:
#   - url: http://YOUR_SPARE_NODE:26657

# Used instead of valoper_address.
validators:
    # Added to the label, keep it stable.
  - name: RIO
    valoper_address: realiovaloper1xxxxxxx...
    # This validator's own nodes, tried before the shared ones.
    nodes:
      - url: http://YOUR_RIO_NODE:26657
        # Alert if this node isn't responding?
        alert_if_down: yes
  - name: dstrx
    valoper_address: realiovaloper1yyyyyyy...
    nodes:
      - url: http://YOUR_DSTRX_NODE:26657
        alert_if_down: yes
