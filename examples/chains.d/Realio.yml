---
# Realio multistaking: several validators on one chain, each with its own node.
# They show up as "Realio / RIO" and "Realio / dstrx".

# chain_id is validated for a match when connecting to an RPC endpoint, also used as a label in several places.
chain_id: realionetwork_3301-1
# Should the monitor revert to using public API endpoints if a validator's nodes fail?
# This isn't always reliable, not all public nodes have websocket proxying setup correctly.
public_fallback: yes

# Only settings that differ from alert_defaults need to be set here.
# alerts:
#   consecutive_missed: 3

# Used instead of valoper_address and nodes.
validators:
    # Added to the label, keep it stable.
  - name: RIO
    # The validator operator address.
    valoper_address: realiovaloper1xxxxxxx...
    # This validator's own nodes, protocol://hostname:port. Without a port https uses 443 and http 80
    nodes:
      - url: http://YOUR_RIO_NODE:26657
        # Should we send an alert if this host isn't responding?
        alert_if_down: yes
  - name: dstrx
    valoper_address: realiovaloper1yyyyyyy...
    nodes:
      - url: http://YOUR_DSTRX_NODE:26657
        alert_if_down: yes
