---
# The file name is the label: Osmosis.yml is "Osmosis".

# Checked against the RPC node when connecting.
chain_id: osmosis-1
# The validator's operator address (valoper). The signing address is looked up from the chain.
valoper_address: osmovaloper1xxxxxxx...
# Fall back to a public RPC node if all your nodes fail? Only use it as a backup.
public_fallback: no
# Added to every alert for this chain, e.g. which tenderduty instance sent it.
# extra_info: "sent from monitor-eu"

# Only settings that differ from alert_defaults.
alerts:
  consecutive_missed: 3
  # Destinations enabled in config.yml are used. To leave one out:
  # telegram:
  #   enabled: no

# RPC nodes, tried in order. Only the RPC port is used, no LCD/REST.
nodes:
  # protocol://hostname:port. Without a port https uses 443 and http 80.
  - url: http://YOUR_OSMOSIS_NODE:26657
    # Alert if this node isn't responding?
    alert_if_down: yes
